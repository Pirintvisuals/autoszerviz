  <!-- Client sample. MP Autó és Klímaszerviz (Shopa Hungary Kft.), Szabó
       Kálmán utca 74., 4030 Debrecen. Since 2012. Mo-P 8-17, Szo 8-12.
       Szerelői verzió, copied from autoszerviz.html AFTER the 2026-10-07
       template rules: the car is typed in (no VIN promise), the mechanic says
       what he found, the tool never diagnoses or advises, it only asks what
       splits the parts and adds extras as the SHOP's own rules. No phone or
       symptom price case.

       Own words on mpauto.hu: olajszerviz, autóklíma szerviz, fékszerviz,
       akkumulátor csere, vezérműszíj csere, kuplung szerviz, futómű szerviz,
       automata váltó olajcsere, dióhéjas tisztítás, vonóhorog szerviz,
       műszaki állapotfelmérés. Márkafüggetlen (Audi, BMW, VW, Skoda, Toyota,
       Hyundai-Kia, Renault...).

       WHY KLÍMA. The business calls itself "Autó és Klímaszerviz" and lists
       autóklíma first. The DM says the demo is built for THEIR shop, so the
       page prices the job they lead with. What splits the parts on a klíma
       repair is the gas (R134a or R1234yf) and the condenser grade, both asked
       as questions, never decided by the tool. The szárítószűrő and the
       fertőtlenítés are the shop's own rule lines.

       All amounts are gross sample figures; the hourly rate is a placeholder.
       Their real labour price list goes in when it is built for them. Their
       site says 6 months warranty, the directory says parts 12: left off the
       sheet on purpose until they confirm.

       Theme off the logo: black circle, white lettering, red (#c81d1d).
       Register: tegezés towards the mechanic, magázás in the CTA. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
