<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Quote Demo</title>
  <!-- AUTÓSZERVIZ SABLON, SZERELŐI VERZIÓ.

       Copy to <szerviz-nev>.html, swap THEME + the marked PLACEHOLDER fields.

       What changed from the first template (eki-auto / mobil-star / rapid are
       still on the old, customer-facing version and are left alone):

       1. THE MECHANIC IS THE ONE TYPING. The user bubbles are the szerelő at
          the emelő, in workshop shorthand. He gives the car, says what he
          found, the agent asks only what's still missing for an exact price.

       2. NO CONTACT DETAILS. No name, phone, email, rendszám-for-CRM. The
          estimate belongs to the car. That's the pitch: the unpaid quoting
          time goes away, not "more leads".

       3. NO AI EXPERT, NO VIN MAGIC (2026-10-07). The tool never diagnoses or
          advises; it asks only what splits the parts (e.g. disc size) and adds
          extras as the shop's own rules. The car is typed in, because VIN
          lookup isn't live. No phone/symptom price case either.

       4. THE FINALE IS A FINISHED ESTIMATE SHEET (CONFIG.mode = 'mechanic'
          in the engine), not an owner lead card: jármű, megállapítás, tételek,
          végösszeg. The thing he'd otherwise type up himself.

       5. REGISTER. The tool tegezi the mechanic (it's a workshop tool). The
          landing page and CTA magázzák the owner, because the DM is magázó.

       Data-only file. Engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
<body>
<div class="page-center" id="hero"></div>
<div id="widget-root"></div>

<script>
// 1. THEME. Graphite workshop base with an amber accent. PLACEHOLDER: pull the
// real colours off the shop's logo or signage, the way every other demo does.
const THEME = {
  bg:'#0e1419', dark:'#1b2732', mid:'#33495c', brand:'#d97706', bright:'#f59e0b',
  dot:'#fcd34d', chatBg:'#fffbf4', tint:'#fde9c8', tint2:'#fef5e5', line:'#f0dcbc',
  ink:'#33495c', inkSoft:'#b45309', ring:'rgba(217,119,6,0.40)', cta:'#f59e0b', cta2:'#d97706',
}

// 2. CONFIG. PLACEHOLDER: name, sub, tagline, logoSrc.
const CONFIG = {
  mode: 'mechanic',
  brand: {
    name: 'Kovács Autószerviz',
    // Hero subtitle = the shop's OWN services, lifted off their page. These are
    // the same hooks the DM opener uses, so the page confirms the DM.
    sub: 'DPF tisztítás, futómű, fék, klíma',
    tagline: 'Márkafüggetlen szerviz, Szolnok',
    initial: 'K',
    logoSrc: '',
    fbHandle: '',
    online: 'Árajánlat-segéd · a műhelynek',
  },
  niche: 'autószerviz',
  tooltip: 'Nézze meg, hogyan dolgozik vele a szerelő ▶',
  currency: { symbol: ' Ft', locale: 'hu-HU', position: 'suffix' },
  sendToOwnerLabel: 'Ajánlat megnyitása →',
  calendly: 'https://calendly.com/pirint-milan/quoting-agent-sample',
  ctaTitle: 'Ez csak egy minta.',
  ctaText: 'Szeretné, hogy ez a saját alkatrészeivel, óradíjával és munkáival számoljon?',
  ctaButton: 'Beszéljünk 15 percet →',
  // The whole pitch in one line: nem Ön gépeli be, nem Ön keresi ki.
  ownerBenefit: 'Alkatrészt, munkaidőt és óradíjat nem kellett összeadni és begépelni: a tételes ajánlat magától állt össze.',
  labels: {
    titleSuffix: 'Árajánlat-segéd (minta)',
    sampleBadge: 'Minta · nem élő rendszer',
    watchHintPre: 'Koppintson a buborékra, magától lejátszódik, ',
    watchHintBold: 'csak nézze',
    watchHintPost: ' ↘',
    replayTitle: 'Újrajátszás',
    closeTitle: 'Bezárás',
    sampleStrip: 'Minta: így használja a szerelő',
    inputPlaceholder: 'Minta, nem kell gépelni',
    estimateIntro: 'Kész az ajánlat',
    estimateIntroSuffix: 'Nézd át, mielőtt odaadod:',
    estimatedTotal: 'Végösszeg',
    timing: 'Munkaidő',
    estimatedQuote: 'Árajánlat',
    bookCallFallback: 'Beszéljünk 15 percet →',
    logoAlt: '{name} logó',
    sheetKicker: 'Kész árajánlat · minta',
    sheetTitle: 'Ezt adja oda az ügyfélnek',
    sheetDoc: 'Árajánlat',
    sheetVehicle: 'Jármű',
    sheetFinding: 'Szerelői megállapítás',
    sheetItems: 'Alkatrész és munkadíj',
    sheetTotal: 'Végösszeg (bruttó)',
    sheetNoContact: 'Se név, se telefonszám, se email nem kellett hozzá.',
  },
}

// 3. MSGS. 'user' = the mechanic. Short, shorthand, the way you'd type with
// greasy hands. The tool never diagnoses or gives expert advice: the mechanic
// says what he found, the tool only asks what splits the parts (size, brand)
// and adds the extras the SHOP set up as rules. No VIN magic (not live yet).
const MSGS = [
  // ── 1. autó: a szerelő adja meg ──
  { r:'agent', t:'Szia! Melyik autó áll bent? Márka, típus, motor.' },
  { r:'user',  t:'Octavia III 1.6 TDI, CLHA, 2015, 218e km' },

  // ── 2. mit talált: a szerelő mondja, nem a program ──
  { r:'agent', t:'Skoda Octavia III 1.6 TDI (CLHA, 77 kW). Mi a munka?' },
  { r:'user',  t:'Első tárcsák vetemedtek, betét 3 mm. Hátul jó, 7 mm' },

  // ── 3. ami az alkatrészt eldönti: kérdez, nem találgat ──
  { r:'agent', t:'Első tárcsa + betét. Erre a típusra kétféle első tárcsa van: 288 mm és 312 mm. Melyik van rajta?' },
  { r:'user',  t:'288' },

  // ── 4. márka a műhely saját listájából ──
  { r:'agent', t:'Melyik márkával számoljak a listádból: utángyártott, prémium (ATE, Brembo) vagy gyári?' },
  { r:'user',  t:'Prémium, ATE' },

  // ── 5. a műhely saját szabálya, nem a program véleménye ──
  { r:'agent', t:'Nálatok fékcseréhez a fékfolyadék is fel van véve külön sorba (ezt ti állítottátok be). Beírjam?' },
  { r:'user',  t:'Igen, 3%-ot mutat' },

  { r:'agent', t:'Összeraktam a te óradíjaddal és árlistáddal.' },
  { r:'estimate' },
]

// 4. EST. The estimate sheet. PLACEHOLDER: óradíj és árak a szerviz saját
// listája szerint. No customer block on purpose.
const EST = {
  mid: 93_000,
  items: [
    { label:'Első féktárcsa pár, 288 mm (ATE)',              amt: 38_000 },
    { label:'Első fékbetét készlet (ATE)',                   amt: 17_000 },
    { label:'Munkadíj: 1,5 óra × 14 000 Ft',                 amt: 21_000 },
    { label:'Fékfolyadék csere (DOT4, 0,5 óra + anyag)',      amt: 14_000 },
    { label:'Féktisztító, apróanyag',                         amt:  3_000 },
  ],
  note: 'Minta árakkal. A fékfolyadék külön tétel, elhagyható.',
  firstName: '',
  timingShort: 'kb. 2 óra',
  quoteNo: 'Á-2026/0412',
  vehicle: [
    ['Típus',          'Skoda Octavia III 1.6 TDI, 2015'],
    ['Motorkód',       'CLHA, 77 kW'],
    ['Km-óra',         '218 000 km'],
  ],
  finding: 'Első féktárcsák (288 mm) vetemedtek, első betétek 3 mm-re kopva. Hátsó fék rendben (betét 7 mm). Fékfolyadék víztartalma 3%, csere javasolt.',
}
</script>
<script src="/quote-agent.js"></script>
</body>
</html>
