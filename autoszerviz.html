  <title>Instant Quote Demo</title>
  <!-- AUTÓSZERVIZ SABLON (prototípus).

       This is the reusable starting point for every szerviz demo. Copy it to
       <szerviz-nev>.html, swap THEME + the marked PLACEHOLDER fields, and keep
       the conversation skeleton, which is the part that does the selling.

       Why it differs from the burkoló demo (borczi-szabolcs.html):

       1. LENGTH IS THE POINT. The DM promises the agent "addig kérdez tovább,
          amíg meg nem van minden". A mechanic will literally count the
          questions, so this flow asks nine, and every one of them is a
          question a real szerviz asks on the phone.

       2. ALVÁZSZÁM. The single exchange that proves the accuracy claim, and it
          kills the "egy sablon nem tudhatja, mi megy az én autómba" objection
          in the shop's own voice instead of ours.

       3. TWO FLOWS. The second, shorter one shows the agent REFUSING to price a
          vague symptom and booking diagnostics instead. Without it the demo
          reads as a salesman; with it, it reads as a mechanic.

       4. NO BUDGET QUESTION. Works for a bathroom, but nobody has a budget for
          a broken clutch, and asking makes it feel like haggling.

       5. DESTINATION TRADE. The customer drives to the szerviz, so the owner
          card drops the distance block and the budget match, and answers what
          the shop actually wants to know before it calls back: when, and which
          parts grade. (EST.urgency / EST.decision / EST.jobValue in the engine.)

       6. REGISTER. Customer side is tegezés. Everything owner-facing is
          magázás, because the DM they arrived from is magázó.

       Data-only file. Engine and styles live in /quote-agent.js and /quote-agent.css. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
<body>
<div class="page-center" id="hero"></div>
<div id="widget-root"></div>

<script>

  { r:'agent', t:'Köszönöm, Gábor, már állítom is össze a tájékoztató árat.' },
  { r:'estimate' },

  // ── Második, rövid folyam: nincs pontos hiba, ezért nincs ár sem ──
  { r:'divider', t:'Másik eset: amikor nincs pontos hiba' },
  { r:'agent', t:'Szia! Árajánlatot szeretnél kérni valamilyen munkára?' },
  { r:'user',  t:'Fékezéskor valami furcsa zajt hallok, és néha felvillan egy lámpa' },
  { r:'agent', t:'Erre látatlanban nem mondok árat, mert a zaj lehet fékbetét, kerékcsapágy vagy féltengely is, és a három között sok tízezer forint a különbség. Milyen autóról van szó és mennyi van benne?' },
  { r:'user',  t:'Ford Focus 1.6, 2013-as, kb 190 000 km' },
  { r:'agent', t:'Köszönöm. Erre diagnosztikát ajánlok: emelőre tesszük, kiolvassuk a hibakódot, és utána kapsz pontos árat a javításra. A diagnosztika 9 000 Ft, és ha nálunk készül el a javítás, beleszámítjuk a munkadíjba.' },
