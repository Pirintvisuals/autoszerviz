  <!-- Client sample. Rapid Autószerviz, Százados u. 1., 5000 Szolnok.
       Tel 30/571-3537 és 70/904-5584, rapidproservice1@gmail.com.

       Their page claims NO specialty. The entire bio is one sentence:
       "Várjuk meglévő és új céges- és magán Ügyfeleinket teljeskörű
       autójavításra." Two openers in this batch died on a service claim that
       did not hold (futómű-beállítás at Eki and at German Car), so nothing
       here invents one. Everything below comes out of that one sentence.

       The hook is CÉGES ÜGYFELEK, which they put first in their own bio and
       which no other demo in this gallery touches. For a fleet customer the
       quote is a different object: it gets forwarded to someone else for
       approval, the invoice goes to the company, and the number that matters
       is the nettó, not the bruttó. So this demo asks a question none of the
       others ask, "céges vagy magánautó", and the answer changes the paper
       the customer walks away with.

       Priced job: front féktárcsa + fékbetét on a VW Caddy 2.0 TDI, the
       archetypal Hungarian céges car. Brakes because they are the highest
       frequency job on a fleet car, they fall squarely inside "teljeskörű
       autójavítás", and they carry a true upsell (fékfolyadék, since the
       system is open and bled anyway) that costs the customer little and
       earns the shop real money.

       Second flow unchanged in shape: a vague symptom gets no price, it gets
       a diagnostic slot.

       Register: tegezés towards the customer, magázás in everything the owner
       reads. No em dashes.

       Logo: drop the file in as rapid-logo.jpg. Until then the engine falls
       back to the "R" mark on its own.

       Data-only file. Engine and styles live in /quote-agent.js and /quote-agent.css. -->
