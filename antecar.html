  <!-- Client sample. AnteCar Márkafüggetlen Autószerviz (ASTON MILL Kft.),
       Tündérfürt utca 7., 1106 Budapest. Mészáros Tibor. Mo-Cs 7-18, P 7-17.
       Own words on antecar.hu: műszaki vizsga (saját vizsgasor), futóműállítás,
       autójavítás, teljes körű diagnosztika (Autel MaxiSYS MS909, SGW),
       gumiszerelés, klíma töltés/javítás/fertőtlenítés, szélvédő, autómentés,
       TPMS, hibrid/elektromos, autóvásárlás előtti átvizsgálás.
       Szerelői verzió (see autoszerviz.html).

       WHY THIS DEMO IS BUILT THE WAY IT IS. Tibor's reply to the DM: "az ügyfél
       csak tüneteket tud maximum elmondani, a járművet diagnosztizálni kell,
       utána lehet pontos árat mondani. Még mi sem tudjuk megmondani, hogy a
       diagnosztika mennyibe fog kerülni." He is right, and the demo agrees
       with him out loud:

       1. The tool starts AFTER the diagnosis. The mechanic has found the leak
          and types what he found. Nobody prices a symptom.
       2. The priced job is a klíma "nem hűt", the textbook case where the
          customer's words are worthless (a leak, a compressor and a
          dryer are three different bills) and the finding decides everything.
       3. Expert moment: system opened -> szárítószűrő goes in, R1234yf by
          model year. Things a mechanic adds by habit and forgets on a
          quote.
       4. Second flow is the phone call he described. The tool REFUSES to price
          the symptom, sends the car to an átvizsgálás first, and only after
          his finding does a quote appear. No figure is invented for the
          diagnosis itself, because he said even he can't.

       All amounts are gross sample figures. The hourly rate is a placeholder,
       AnteCar's real one goes in when it is built for them.

       Theme off their logo: near-black + amber. Register: tegezés towards the
       mechanic (workshop tool), magázás in the CTA. No em dashes. -->
  <link rel="stylesheet" href="/quote-agent.css">
</head>
