  <!-- Client sample. Eki Autó Kft., Füzes dűlő 35., 7631 Pécs, tel (70) 363 4794.
       566 követő. Saját oldaláról: autó- és motorkerékpár javítása és
       szervizelése, gumiszerelés, centírozás, klímatöltés, tisztítás, javítás,
       futóműállítás.

       The profile picture is not a logo, it is a photo of their own workshop,
       and it decided the scenario. Visible in it: a blue Golf Mk4 up on the
       two-post lift with the front hub stripped, a MONROE lengéscsillapító
       banner on the wall, a quad parked in the corner, Magneti Marelli parts
       poster. So this demo prices the exact job their own photo shows, on the
       exact car in it, with the brand of shock absorber they advertise on
       their own wall. If he recognises anything on this page, he recognises
       his own workshop.

       Main flow: first lengéscsillapító pair + gumibak and ütközőgumi + first
       axle futóműállítás on a 2002 Golf IV 1.9 TDI. Chosen because it hits
       three of their four advertised services at once, and because the
       "utána mindenképp kell futóműállítás, különben eszi a gumit" upsell is
       true, is money, and is their own service.

       Second flow: a vague symptom (motorway steering shake, knock at the
       front left), where the agent refuses to name a price and books a futómű
       átvizsgálás instead. That branch is what stops the demo reading as a
       salesman.

       Register: tegezés towards the customer, magázás in everything the owner
       reads, because the DM he arrives from is magázó.
       Dialogue short, no em dashes.

       Data-only file. Engine and styles live in /quote-agent.js and /quote-agent.css. -->
