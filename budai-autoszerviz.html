       (Csepel), plus Szeged. Szerelői verzió (see autoszerviz.html).

       olajcsere, vezérlés csere, klímatöltés minden gáztípussal. Mobil Star
       (also Bosch) already prices a kuplung, so this one prices their most
       distinctive line: automata váltó olajcsere.

       Expert moments: the alvázszám settles WHICH automatic (6-speed wet
       DQ250, 60 000 km interval, external filter); the adaptation run after
       the oil change goes on its own line; and the agent refuses to promise
       the jerking will stop, putting the next step in the note instead.

       Second flow uses their "minden gáztípussal" line: a 2019 car is
       R1234yf, and an empty system means a leak to find first.

       Theme: Bosch blue + red, same as mobil-star.html. -->
