       send them claimants, and insurance jobs are priced through the
       insurer's kárfelvétel. So the demo is the job the tool CAN help with:
       a private-pay (saját zsebből) body + paint job.

       finding, the tool only asks what splits the parts (parking sensors =
       bumper variant, színkód, brand), and the beszínezés of the next panel
       is framed as the shop's own rule, not the tool's opinion. No phone or
       symptom case.

       Their contact (FB) said they have "saját weblap szerkesztő" and
       assumed this was a website thing. It isn't: the page never mentions
       a website, it's a workshop tool.

       Logo: their wide wordmark restacked into a square

</head>
