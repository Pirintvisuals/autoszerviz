<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tóth Garázs · Árajánlat-segéd (minta)</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Client sample. Tóth Garázs Kft., Budapesti út 1., 3100 Salgótarján.
       (70) 335 6244, tothgarazs@gmail.com. Logo: "prémium autó és
       gumigyorsszerviz".

       FIRST PAGE ON THE NEW TEMPLATE (2026-10-22): the self-playing copy of
       the real workshop screen (ajanlat-demo.js + ajanlat-demo.css), not the
       chat bubble. Data only - the engine builds the page.

       WHY A BMW BRAKE JOB. The logo leads with "prémium autó", so the sample
       prices a premium car. On a BMW the wear sensor is its own part and the
       brake needs a CBS reset afterwards, so the questions are real ones a
       mechanic would recognise. Which brake is fitted (normál / M Sport) is
       what splits the discs; it is asked, never decided by the tool.

       Template rules (2026-10-07): car typed in, no VIN promise; the tool
       never diagnoses; extras are the shop's own rule; no supplier named.
       All amounts are NET sample figures and the 15 000 Ft hourly rate is a
       placeholder. Theme off the logo: black, red (#D7262E), white.
       Register: tegezés toward the mechanic in the tool, magázás in the CTA. -->
  <link rel="stylesheet" href="/ajanlat-demo.css">
  <style>
    :root {
      --dark: #0b0b0c;
      --accent: #D7262E; --accent-strong: #B01E25; --accent-ink: #B01E25;
      --accent-rgb: 215,38,46; --on-accent: #FFFFFF; --warn-bg: #FDEDED;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --accent-ink: #F87171; --warn-bg: #2A1414; }
    }
    :root[data-theme="dark"] { --accent-ink: #F87171; --warn-bg: #2A1414; }
  </style>
</head>
<body>
<script>

    button: 'Beszéljünk 15 percet →',
