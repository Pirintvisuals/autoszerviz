       Saját oldaláról, szó szerint a felsorolt szolgáltatások:
       fék (fékbetét, féktárcsa, fékfolyadék), futómű javítás, kuplungcsere,
       gumicsere, diagnosztikai kiolvasás és élő adatok elemzése, hibakód
       törlés, vásárlás előtti/utáni átvizsgálás, akkumulátor mérés és csere,
       kipufogó javítás, vezérlés csere, motorfelújítás, karosszéria javítás,
       műszaki vizsga, eredetvizsga.

       Why this demo prices a KUPLUNGCSERE: they list it under two separate
       headings on their own page, it is their biggest routine ticket, and it
       carries the single most recognisable true upsell in the trade, the
       kétömegű lendkerék. The váltó is already off the car, so the flywheel
       goes in for parts cost only; done separately later it is the whole
       labour bill again. Every mechanic knows this. Seeing an automated
       quote raise it unprompted is the moment the page stops looking like a
       toy.

       The alvázszám beat is stronger here than on the Eki demo: on a 2.0 TDI
       the alvázszám settles both the clutch diameter AND whether the car is
       kézi váltós or DSG, which is a completely different job. So the
       question visibly prevents a wrong quote rather than just sounding
       thorough.

       Second flow routes into their OWN advertised service, by name:
       diagnosztikai kiolvasás and élő adatok elemzése, rather than a generic
       "megnézzük". They sell diagnostics, so the branch that refuses to price
       a symptom sends work straight into a service they already charge for.

       Theme taken off their real logo: Bosch blue base, Bosch red accent.
       Register: tegezés towards the customer, magázás in everything the owner
       reads. No em dashes.

       Data-only file. Engine and styles live in /quote-agent.js and /quote-agent.css. -->
